<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>向胜蓝 · 个人简历</title>
<style>
  :root { --blue:#0070C0; --navy:#1B2A4A; --ink:#1a1a1a; --muted:#666; --line:#e5e7eb; --bg:#f5f7fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:1000px; margin:0 auto; padding:40px 20px 60px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:20px; }
  .eyebrow { font-size:12px; letter-spacing:2px; color:var(--blue); font-weight:600; }
  h1 { font-size:30px; margin:8px 0 6px; letter-spacing:1px; }
  .sub { color:var(--muted); font-size:14px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 18px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; border:1px solid transparent; }
  .btn-primary { background:var(--navy); color:#fff; }
  .btn-secondary { background:#fff; color:var(--navy); border-color:var(--line); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(27,42,74,.06); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
  .toolbar a { color:var(--blue); text-decoration:none; font-weight:600; }
  .preview { max-height:calc(100vh - 240px); min-height:520px; overflow:auto; background:#eef1f5; padding:16px; text-align:center; }
  .preview img { max-width:100%; height:auto; box-shadow:0 6px 24px rgba(27,42,74,.12); background:#fff; }
  .hint { margin-top:14px; font-size:12px; color:var(--muted); text-align:center; }
  @media (max-width:640px) {
    .wrap { padding:26px 14px 40px; }
    .head { flex-direction:column; align-items:flex-start; }
    h1 { font-size:26px; }
    .preview { max-height:70vh; min-height:520px; padding:8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">PERSONAL RESUME</div>
      <h1>向胜蓝</h1>
      <div class="sub">产品 / AI 应用方向 · 在线简历</div>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="resume.pdf" download>下载 PDF</a>
      <a class="btn btn-secondary" href="resume.pdf" target="_blank" rel="noopener">新窗口打开</a>
    </div>
  </div>
  <div class="card">
    <div class="toolbar">
      <span>在线预览 · A4 单页</span>
      <a href="preview.jpg" target="_blank" rel="noopener">查看大图</a>
    </div>
    <div class="preview"><img src="preview.jpg" alt="向胜蓝个人简历预览"></div>
  </div>
  <div class="hint">如果浏览器无法直接预览 PDF，请点击右上角“下载 PDF”查看。</div>
</div>
</body>
</html>
